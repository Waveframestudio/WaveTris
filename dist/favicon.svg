<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e24" />
      <stop offset="100%" stop-color="#050409" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="10" />

  <!-- Waveframe Arc Glow -->
  <path d="M 120 135 C 200 85, 312 85, 392 135" fill="none" stroke="#22d3ee" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 140 175 C 210 135, 302 135, 372 175" fill="none" stroke="#a78bfa" stroke-width="16" stroke-linecap="round" opacity="0.85" />

  <!-- Tetris Blocks in Center -->
  <g filter="url(#glow)" transform="translate(10, 25)">
    <!-- T-Piece Top Block -->
    <rect x="206" y="210" width="100" height="100" rx="18" fill="url(#purpleGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
    <!-- T-Piece Left Block -->
    <rect x="96" y="320" width="100" height="100" rx="18" fill="url(#purpleGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
    <!-- T-Piece Center Block -->
    <rect x="206" y="320" width="100" height="100" rx="18" fill="url(#purpleGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
    <!-- T-Piece Right Block -->
    <rect x="316" y="320" width="100" height="100" rx="18" fill="url(#cyanGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="4" />
  </g>
</svg>
